name: Legacy Dossier Preview (Retired Checkout)

on:
  workflow_dispatch:
    inputs:
      product_type:
        description: Report type for internal preview
        required: true
        type: choice
        options:
          - location_dossier
          - facility_risk_passport
          - physical_risk_evidence_pack
          - pre_underwriting_site_intelligence
          - business_continuity_threat_register
        default: location_dossier
      location:
        description: Location or coordinates to analyse
        required: true
        type: string
      site_name:
        description: Facility / site name
        required: true
        type: string
      customer_name:
        description: Client/contact name shown in preview
        required: false
        type: string
      occupancy:
        description: Site use / purpose
        required: false
        type: string
        default: Commercial property / facility

permissions:
  contents: read

jobs:
  preview-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libjpeg-dev libopenjp2-7-dev libffi-dev fonts-inter fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate internal preview only
        env:
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          python - <<'PY'
          import json, os
          from brink_dossier.render import produce

          inputs = json.loads(os.environ.get("INPUTS_JSON", "{}"))
          pdf_path, ref = produce(
              location=inputs["location"],
              answers={
                  "customer_name": inputs.get("customer_name") or "Internal Preview",
                  "occupancy": inputs.get("occupancy") or "Commercial property / facility",
                  "location_label": inputs["location"],
              },
              site_name=inputs["site_name"],
              customer_email=None,
              product_type=inputs.get("product_type") or "location_dossier",
          )
          print(f"Internal preview generated: {pdf_path} · {ref}")
          print("No client email is sent and no order is marked delivered by this retired workflow.")
          PY

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: internal-dossier-preview
          path: reports/*.pdf
          if-no-files-found: error
