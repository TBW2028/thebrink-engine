name: Generate and Dispatch Dossier

on:
  repository_dispatch:
    types: [order_paid]
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libjpeg-dev libopenjp2-7-dev libffi-dev fonts-inter fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Engine & Dispatch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python -c '
          import os, json
          from brink_dossier.render import produce

          payload = json.loads(os.environ.get("PAYLOAD", "{}"))
          print(f"[*] Fulfilling incoming order: {payload}")

          produce(
              location=payload.get("location", "18.516958, 73.666824"),
              answers=payload.get("answers", {}),
              site_name=payload.get("site_name", "Monitored Asset"),
              customer_email=payload.get("customer_email", "thebrink2028@gmail.com")
          )
          '
